name: Unsigned iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bundle_identifier:
        description: Bundle-ID passend zum App-ID-Eintrag des Provisioning-Profils
        required: true
        type: string
        default: com.example.CraftyNative

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build iPhone app without signing
        env:
          BUNDLE_IDENTIFIER: ${{ inputs.bundle_identifier || 'com.example.CraftyNative' }}
        run: |
          set -euo pipefail
          [[ "$BUNDLE_IDENTIFIER" =~ ^[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$ ]] || { echo 'Ungültige Bundle-ID'; exit 1; }
          xcodebuild \
            -project CraftyNative.xcodeproj \
            -scheme CraftyNative \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/CraftyBuild" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_IDENTIFIER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/CraftyBuild/Build/Products/Release-iphoneos/CraftyNative.app"
          test -d "$app"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")
          test -n "$executable"
          test -x "$app/$executable"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$app" "$RUNNER_TEMP/ipa/Payload/CraftyNative.app"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/CraftyNative-unsigned.ipa" Payload)
          test -s CraftyNative-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CraftyNative-unsigned-ipa
          path: CraftyNative-unsigned.ipa
          if-no-files-found: error
